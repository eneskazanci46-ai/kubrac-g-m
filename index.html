<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kübra ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
    }

    .box {
      padding: 40px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    p {
      font-size: 24px;
    }

    .heart {
      font-size: 70px;
      animation: kalp 1s infinite;
    }

    @keyframes kalp {
      50% {
        transform: scale(1.2);
      }
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="heart">❤️</div>
    <h1>Kübra seni çok seviyorum ❤️</h1>
    <p>Çıkıyorum... Ama aklım hep sende 🥹</p>
  </div>

</body>
</html>
